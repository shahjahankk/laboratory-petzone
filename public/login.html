<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PetZone Laboratory</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <a href="/"><img src="/img/petzonelogo.png" alt="PetZone" class="logo-lg" onerror="this.src='/img/petzonelogo.svg'"></a>
    <nav><a href="/" class="btn btn-outline btn-sm">Home</a></nav>
  </header>

  <div class="container" style="max-width: 480px;">
    <div class="card">
      <div style="text-align:center; margin-bottom: 20px;">
        <img src="/img/petzonelogo.png" alt="PetZone" style="height:64px" onerror="this.src='/img/petzonelogo.svg'">
        <h2 style="color:var(--blue); margin-top:12px;" id="formTitle">Staff Login</h2>
        <p class="hint" id="formHint">Sign in to PetZone Laboratory</p>
      </div>

      <div id="alert" class="alert alert-error" style="display:none;"></div>

      <form id="authForm">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label for="name">Full Name</label>
          <input id="name" name="name" placeholder="Lab Admin">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="lab@petzone.pk">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-eye" id="togglePassword" aria-label="Show password" title="Show password">
              <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;" id="submitBtn">Login</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let needsSetup = false;

    function showError(msg) {
      const el = document.getElementById('alert');
      el.style.display = 'block';
      el.textContent = msg;
    }

    async function init() {
      try {
        const status = await LabApp.api('/api/auth/status');
        needsSetup = !!status.needsSetup;
        if (needsSetup) {
          document.getElementById('formTitle').textContent = 'First-time Setup';
          document.getElementById('formHint').textContent = 'Create the first lab admin account';
          document.getElementById('nameGroup').style.display = 'block';
          document.getElementById('name').required = true;
          document.getElementById('submitBtn').textContent = 'Create Admin';
        }
      } catch (err) {
        showError(err.message || 'Cannot reach server / database');
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');
      document.getElementById('alert').style.display = 'none';

      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };
      if (needsSetup) body.name = document.getElementById('name').value.trim();

      try {
        const data = await LabApp.api(needsSetup ? '/api/auth/setup' : '/api/auth/login', {
          method: 'POST',
          body,
        });
        LabApp.setToken(data.token);
        window.location.href = '/dashboard';
      } catch (err) {
        showError(err.message || 'Login failed');
      }
    });

    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePassword');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display = show ? 'none' : 'block';
      btn.querySelector('.eye-closed').style.display = show ? 'block' : 'none';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.title = show ? 'Hide password' : 'Show password';
    });

    init();
  </script>
</body>
</html>
