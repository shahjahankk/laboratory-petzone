<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 3 · Results — PetZone Laboratory</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <a href="/dashboard"><img src="/img/petzonelogo.png" alt="PetZone" class="logo-lg" onerror="this.src='/img/petzonelogo.svg'"></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container" style="max-width:960px;">
    <h2 style="color:var(--blue);">Enter Results</h2>
    <p class="hint" style="margin-bottom:16px;">Step 3 of 4 — Values only (references follow Dog/Cat)</p>
    <div id="stepper"></div>
    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <div class="card" style="margin-bottom:16px;">
      <p class="hint" id="summary" style="margin-bottom:12px;"></p>
      <div id="resultsArea"><p class="hint">Loading...</p></div>
    </div>

    <div class="wizard-nav">
      <a href="/report/new/tests" class="btn btn-outline">← Back: Tests</a>
      <button type="button" class="btn btn-primary" id="nextBtn">Next: Preview Report →</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function refFor(param, species) {
      if (species === 'Cat') return param.reference_range_cat || param.reference_range || '—';
      return param.reference_range_dog || param.reference_range || '—';
    }

    function collectResults() {
      const results = {};
      document.querySelectorAll('#resultsArea tr[data-parameter-id]').forEach((tr) => {
        const id = String(tr.dataset.parameterId);
        const input = tr.querySelector('.val');
        results[id] = input ? input.value.trim() : '';
      });
      return results;
    }

    function goNext() {
      showAlert('');
      const results = collectResults();
      LabApp.saveDraft({ results });
      window.location.assign('/report/new/preview');
    }

    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.preventDefault();
      goNext();
    });

    (async () => {
      try {
        const user = await LabApp.requireAuth();
        if (!user) return;
        const draft = LabApp.guardStep(['patient', 'tests']);
        if (!draft) return;

        document.getElementById('logoutBtn').onclick = () => LabApp.logout();
        document.getElementById('stepper').innerHTML = LabApp.renderStepper(3);
        document.getElementById('summary').innerHTML =
          `<strong>${LabApp.escapeHtml(draft.pet_name)}</strong> · Species: <strong>${LabApp.escapeHtml(draft.species)}</strong>`;

        const tpl = await LabApp.api('/api/templates');
        const idSet = new Set((draft.panel_ids || []).map(Number));
        const selected = (tpl.panels || []).filter((p) => idSet.has(Number(p.id)));
        const saved = draft.results || {};

        if (!selected.length) {
          document.getElementById('resultsArea').innerHTML =
            '<p class="hint">No tests selected. Go back and choose tests.</p>';
          return;
        }

        document.getElementById('resultsArea').innerHTML = selected.map((panel) => `
          <div class="result-block">
            <h3>${LabApp.escapeHtml(panel.code)} — ${LabApp.escapeHtml(panel.name)}</h3>
            <table>
              <thead>
                <tr>
                  <th style="width:40%">Parameter</th>
                  <th style="width:20%">Result</th>
                  <th style="width:15%">Unit</th>
                  <th style="width:25%">Reference (${LabApp.escapeHtml(draft.species)})</th>
                </tr>
              </thead>
              <tbody>
                ${(panel.parameters || []).map((param) => `
                  <tr data-parameter-id="${param.id}">
                    <td>${LabApp.escapeHtml(param.name)}</td>
                    <td><input class="val" value="${LabApp.escapeHtml(saved[param.id] || saved[String(param.id)] || '')}" placeholder="Value" inputmode="decimal"></td>
                    <td>${LabApp.escapeHtml(param.unit || '—')}</td>
                    <td>${LabApp.escapeHtml(refFor(param, draft.species))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `).join('');
      } catch (err) {
        showAlert(err.message || 'Failed to load results page');
      }
    })();
  </script>
</body>
</html>
