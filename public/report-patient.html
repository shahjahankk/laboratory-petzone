<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1  -  Patient  -  Pet Zone Laboratory</title>
  <link rel="stylesheet" href="/api/static/styles.css?v=25">
</head>
<body>
  <header class="header">
    <a class="header-brand" href="/dashboard"><img src="/api/static/img/petzonelogo.png" alt="PetZone" class="logo-lg"><span class="brand-text"><span class="brand-title">Pet Zone Laboratory</span></span></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container" style="max-width:920px;">
    <h2 style="color:var(--blue);">New Lab Report</h2>
    <p class="hint" style="margin-bottom:16px;">Step 1 of 4  -  Patient details</p>
    <div id="stepper"></div>
    <div id="alert" class="alert alert-error" style="display:none;"></div>
    <div id="okAlert" class="alert alert-ok" style="display:none;"></div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="section-title">Search by phone number</h3>
      <p class="hint" style="margin-bottom:12px;">
        Enter phone (e.g. <strong>9231231231</strong>). One number can have many pets  -  pick a pet or register a new one for the same owner.
      </p>
      <div class="toolbar">
        <input id="patientSearch" placeholder="Phone number..." style="flex:1; min-width:220px;" inputmode="tel">
        <button type="button" class="btn btn-outline btn-sm" id="patientSearchBtn">Search</button>
        <button type="button" class="btn btn-pink btn-sm" id="registerNewBtn" disabled>Register new pet</button>
        <button type="button" class="btn btn-outline btn-sm" id="clearPatientBtn">Clear all</button>
      </div>

      <div id="ownerBox" class="owner-match" style="display:none; margin-top:14px;"></div>

      <div class="form-group" style="margin-top:14px; margin-bottom:8px;">
        <label for="petSelect">Pets on this number</label>
        <select id="petSelect" disabled>
          <option value="">Search a phone number first</option>
        </select>
      </div>
      <p class="hint" id="searchHint">No search yet.</p>
    </div>

    <div class="card" id="patientForm">
      <h3 class="section-title">Patient Details</h3>
      <div class="grid-3">
        <div class="form-group">
          <label>Owner / Patient Name *</label>
          <input id="patient_name" name="patient_name" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input id="owner_phone" name="owner_phone" autocomplete="tel" inputmode="tel">
        </div>
        <div class="form-group">
          <label>Referring Vet</label>
          <input id="referring_vet" name="referring_vet">
        </div>
        <div class="form-group">
          <label>Pet Name *</label>
          <input id="pet_name" name="pet_name">
        </div>
        <div class="form-group">
          <label>Species *</label>
          <select id="species" name="species">
            <option value="">Select Dog or Cat</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Breed</label>
          <input id="breed" name="breed">
        </div>
        <div class="form-group">
          <label>Age</label>
          <input id="age" name="age" placeholder="e.g. 3 years">
        </div>
        <div class="form-group">
          <label>Sex</label>
          <select id="sex" name="sex">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Male Neutered</option>
            <option>Female Spayed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sample Date</label>
          <input type="date" id="sample_date" name="sample_date">
        </div>
        <div class="form-group">
          <label>Report Date</label>
          <input type="date" id="report_date" name="report_date">
        </div>
      </div>
      <div class="form-group">
        <label>Remarks</label>
        <textarea id="remarks" name="remarks" rows="2"></textarea>
      </div>

      <div class="wizard-nav">
        <a href="/dashboard" class="btn btn-outline">Cancel</a>
        <button type="button" class="btn btn-primary" id="nextBtn">Next: Select Tests â†’</button>
      </div>
    </div>
  </div>

  <script src="/api/static/app.js?v=25"></script>
  <script>
    let lastSearch = null;

    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
      if (msg) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showOk(msg) {
      const el = document.getElementById('okAlert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }

    function setVal(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value == null ? '' : value;
    }

    function fillOwnerOnly(owner) {
      setVal('patient_name', owner.patient_name || '');
      setVal('owner_phone', owner.owner_phone || '');
      setVal('referring_vet', owner.referring_vet || '');
      // Pet fields empty for new pet registration
      setVal('pet_name', '');
      setVal('species', '');
      setVal('breed', '');
      setVal('age', '');
      setVal('sex', '');
      setVal('remarks', '');
    }

    function fillPet(pet) {
      setVal('patient_name', pet.patient_name || '');
      setVal('owner_phone', pet.owner_phone || '');
      setVal('referring_vet', pet.referring_vet || '');
      setVal('pet_name', pet.pet_name || '');
      setVal('species', LabApp.normalizeSpecies(pet.species));
      setVal('breed', pet.breed || '');
      setVal('age', pet.age || '');
      setVal('sex', pet.sex || '');
    }

    function fillForm(data) {
      [
        'patient_name', 'owner_phone', 'referring_vet', 'pet_name', 'species',
        'breed', 'age', 'sex', 'sample_date', 'report_date', 'remarks'
      ].forEach((k) => {
        if (data[k] != null) setVal(k, data[k]);
      });
    }

    function renderPetDropdown(pets) {
      const select = document.getElementById('petSelect');
      if (!pets.length) {
        select.innerHTML = '<option value="">No pets found for this number</option>';
        select.disabled = true;
        return;
      }
      select.disabled = false;
      select.innerHTML =
        '<option value="">Select a pet...</option>' +
        pets.map((p, i) => {
          const label = `${p.pet_name || 'Unnamed'} (${p.species || 'N/A'})${p.breed ? '  -  ' + p.breed : ''}`;
          return `<option value="${i}">${LabApp.escapeHtml(label)}</option>`;
        }).join('');
    }

    function renderOwnerBox(owner, petCount) {
      const box = document.getElementById('ownerBox');
      if (!owner) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      box.style.display = 'block';
      box.innerHTML = `
        <strong>Owner found:</strong> ${LabApp.escapeHtml(owner.patient_name || ' - ')}
         -  Phone: ${LabApp.escapeHtml(owner.owner_phone || ' - ')}
         -  Pets: ${petCount}
      `;
    }

    async function searchByPhone(q = '') {
      showAlert('');
      showOk('');
      const hint = document.getElementById('searchHint');
      const registerBtn = document.getElementById('registerNewBtn');
      registerBtn.disabled = true;
      lastSearch = null;

      if (!q) {
        hint.textContent = 'Enter a phone number to search.';
        renderPetDropdown([]);
        renderOwnerBox(null, 0);
        return;
      }

      hint.textContent = 'Searching...';
      try {
        const data = await LabApp.api('/api/patients?q=' + encodeURIComponent(q));
        lastSearch = data;

        if (!data.pets.length) {
          hint.textContent = 'No record for this phone. Fill details below to register new owner + pet.';
          renderPetDropdown([]);
          renderOwnerBox(null, 0);
          setVal('owner_phone', q);
          return;
        }

        const owner = data.owners[0] || {
          patient_name: data.pets[0].patient_name,
          owner_phone: data.pets[0].owner_phone,
          referring_vet: data.pets[0].referring_vet,
        };

        renderOwnerBox(owner, data.pets.length);
        renderPetDropdown(data.pets);
        registerBtn.disabled = false;
        hint.textContent = `Found ${data.pets.length} pet(s). Select one, or click "Register new pet" for this number.`;
      } catch (err) {
        hint.textContent = err.message || 'Search failed';
        renderPetDropdown([]);
        renderOwnerBox(null, 0);
      }
    }

    function registerNewForNumber() {
      showAlert('');
      if (!lastSearch || !lastSearch.pets.length) {
        showAlert('Search a phone number first');
        return;
      }
      const owner = lastSearch.owners[0] || lastSearch.pets[0];
      fillOwnerOnly({
        patient_name: owner.patient_name,
        owner_phone: owner.owner_phone || document.getElementById('patientSearch').value.trim(),
        referring_vet: owner.referring_vet,
      });
      document.getElementById('petSelect').value = '';
      document.getElementById('pet_name').focus();
      showOk('Owner/phone filled. Enter the NEW pet details (name, species, etc.), then Next.');
    }

    function goNext() {
      showAlert('');
      showOk('');
      const species = LabApp.normalizeSpecies(val('species'));
      const patient_name = val('patient_name');
      const pet_name = val('pet_name');
      const owner_phone = val('owner_phone');

      if (!patient_name || !pet_name) {
        showAlert('Owner name and pet name are required');
        return;
      }
      if (!owner_phone) {
        showAlert('Phone number is required');
        return;
      }
      if (species !== 'Dog' && species !== 'Cat') {
        showAlert('Please select Dog or Cat');
        return;
      }

      LabApp.saveDraft({
        patient_name,
        owner_phone,
        pet_name,
        species,
        breed: val('breed'),
        age: val('age'),
        sex: val('sex'),
        referring_vet: val('referring_vet'),
        sample_date: val('sample_date') || LabApp.today(),
        report_date: val('report_date') || LabApp.today(),
        remarks: val('remarks'),
        status: 'final',
      });

      const check = LabApp.getDraft();
      if (!check.patient_name || !check.pet_name || !check.species) {
        showAlert('Could not save patient details. Please try again.');
        return;
      }

      window.location.assign('/report/new/tests');
    }

    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.preventDefault();
      goNext();
    });

    document.getElementById('petSelect').addEventListener('change', () => {
      if (!lastSearch || !lastSearch.pets) return;
      const idx = document.getElementById('petSelect').value;
      if (idx === '') return;
      const pet = lastSearch.pets[Number(idx)];
      if (!pet) return;
      fillPet(pet);
      showOk(`Loaded pet: ${pet.pet_name}. You can edit details if needed, then Next.`);
    });

    document.getElementById('registerNewBtn').addEventListener('click', (e) => {
      e.preventDefault();
      registerNewForNumber();
    });

    (async () => {
      try {
        const user = await LabApp.requireAuth();
        if (!user) return;

        document.getElementById('logoutBtn').onclick = () => LabApp.logout();
        document.getElementById('stepper').innerHTML = LabApp.renderStepper(1);

        const params = new URLSearchParams(location.search);
        const editId = params.get('edit');
        const patientQ = params.get('patient');
        const fresh = params.get('fresh') === '1';

        if (fresh && !editId) {
          LabApp.clearDraft();
          LabApp.saveDraft(LabApp.emptyDraft());
        }

        if (editId) {
          const data = await LabApp.api(`/api/reports/${editId}`);
          const r = data.report;
          const results = {};
          const included = [];
          (r.panels || []).forEach((panel) => {
            (panel.results || []).forEach((row) => {
              results[row.parameter_id] = row.value || '';
              included.push(Number(row.parameter_id));
            });
          });
          LabApp.saveDraft({
            editId: r.id,
            patient_name: r.patient_name || '',
            owner_phone: r.owner_phone || '',
            pet_name: r.pet_name || '',
            species: LabApp.normalizeSpecies(r.species),
            breed: r.breed || '',
            age: r.age || '',
            sex: r.sex || '',
            referring_vet: r.referring_vet || '',
            sample_date: String(r.sample_date || LabApp.today()).slice(0, 10),
            report_date: String(r.report_date || LabApp.today()).slice(0, 10),
            remarks: r.remarks || '',
            clinical_notes: r.clinical_notes || '',
            status: 'final',
            panel_ids: (r.panels || []).map((p) => p.id),
            included_parameter_ids: included,
            parameter_ids_snapshot: included,
            results,
            images: r.images || [],
            forms: r.forms || {},
          });
        } else if (!localStorage.getItem(LabApp.draftKey) && !sessionStorage.getItem(LabApp.draftKey)) {
          LabApp.saveDraft(LabApp.emptyDraft());
        }

        fillForm(LabApp.getDraft());

        document.getElementById('patientSearchBtn').onclick = () =>
          searchByPhone(document.getElementById('patientSearch').value.trim());
        document.getElementById('patientSearch').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            searchByPhone(e.target.value.trim());
          }
        });
        document.getElementById('clearPatientBtn').onclick = () => {
          LabApp.saveDraft({
            ...LabApp.emptyDraft(),
            editId: LabApp.getDraft().editId,
          });
          fillForm(LabApp.getDraft());
          lastSearch = null;
          document.getElementById('patientSearch').value = '';
          document.getElementById('registerNewBtn').disabled = true;
          renderPetDropdown([]);
          renderOwnerBox(null, 0);
          document.getElementById('searchHint').textContent = 'Cleared. Search a phone number to continue.';
          showOk('');
          showAlert('');
        };

        // If coming from dashboard with phone/pet query, try phone search
        if (patientQ && /^\d{7,}$/.test(String(patientQ).replace(/\D/g, ''))) {
          document.getElementById('patientSearch').value = patientQ;
          await searchByPhone(patientQ);
        } else if (patientQ) {
          document.getElementById('patientSearch').value = patientQ;
          await searchByPhone(patientQ);
        }
      } catch (err) {
        showAlert(err.message || 'Page failed to load');
      }
    })();
  </script>
</body>
</html>
