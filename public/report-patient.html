<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1 · Patient — PetZone Laboratory</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <a href="/dashboard"><img src="/img/petzonelogo.png" alt="PetZone" class="logo-lg" onerror="this.src='/img/petzonelogo.svg'"></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container" style="max-width:920px;">
    <h2 style="color:var(--blue);">New Lab Report</h2>
    <p class="hint" style="margin-bottom:16px;">Step 1 of 4 — Patient details</p>
    <div id="stepper"></div>
    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="section-title">Find existing patient</h3>
      <div class="toolbar">
        <input id="patientSearch" placeholder="Search owner, pet, or phone..." style="flex:1; min-width:220px;">
        <button type="button" class="btn btn-outline btn-sm" id="patientSearchBtn">Search</button>
        <button type="button" class="btn btn-outline btn-sm" id="clearPatientBtn">New Patient</button>
      </div>
      <div id="patientResults" class="patient-list" style="margin-top:12px;"></div>
    </div>

    <div class="card" id="patientForm">
      <h3 class="section-title">Patient Details</h3>
      <div class="grid-3">
        <div class="form-group">
          <label>Owner / Patient Name *</label>
          <input id="patient_name" name="patient_name" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input id="owner_phone" name="owner_phone" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>Referring Vet</label>
          <input id="referring_vet" name="referring_vet">
        </div>
        <div class="form-group">
          <label>Pet Name *</label>
          <input id="pet_name" name="pet_name">
        </div>
        <div class="form-group">
          <label>Species *</label>
          <select id="species" name="species">
            <option value="">Select Dog or Cat</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Breed</label>
          <input id="breed" name="breed">
        </div>
        <div class="form-group">
          <label>Age</label>
          <input id="age" name="age" placeholder="e.g. 3 years">
        </div>
        <div class="form-group">
          <label>Sex</label>
          <select id="sex" name="sex">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Male Neutered</option>
            <option>Female Spayed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sample Date</label>
          <input type="date" id="sample_date" name="sample_date">
        </div>
        <div class="form-group">
          <label>Report Date</label>
          <input type="date" id="report_date" name="report_date">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status" name="status">
            <option value="final">Final</option>
            <option value="draft">Draft</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Remarks</label>
        <textarea id="remarks" name="remarks" rows="2"></textarea>
      </div>

      <div class="wizard-nav">
        <a href="/dashboard" class="btn btn-outline">Cancel</a>
        <button type="button" class="btn btn-primary" id="nextBtn">Next: Select Tests →</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
      if (msg) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function val(id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }

    function setVal(id, value) {
      const el = document.getElementById(id);
      if (el && value != null) el.value = value;
    }

    function fillForm(data) {
      [
        'patient_name', 'owner_phone', 'referring_vet', 'pet_name', 'species',
        'breed', 'age', 'sex', 'sample_date', 'report_date', 'status', 'remarks'
      ].forEach((k) => {
        if (data[k] != null) setVal(k, data[k]);
      });
    }

    function goNext() {
      showAlert('');
      const species = LabApp.normalizeSpecies(val('species'));
      const patient_name = val('patient_name');
      const pet_name = val('pet_name');

      if (!patient_name || !pet_name) {
        showAlert('Owner name and pet name are required');
        return;
      }
      if (species !== 'Dog' && species !== 'Cat') {
        showAlert('Please select Dog or Cat');
        return;
      }

      LabApp.saveDraft({
        patient_name,
        owner_phone: val('owner_phone'),
        pet_name,
        species,
        breed: val('breed'),
        age: val('age'),
        sex: val('sex'),
        referring_vet: val('referring_vet'),
        sample_date: val('sample_date') || LabApp.today(),
        report_date: val('report_date') || LabApp.today(),
        remarks: val('remarks'),
        status: val('status') || 'final',
      });

      // Verify draft saved before leaving
      const check = LabApp.getDraft();
      if (!check.patient_name || !check.pet_name || !check.species) {
        showAlert('Could not save patient details. Please try again.');
        return;
      }

      window.location.assign('/report/new/tests');
    }

    async function searchPatients(q = '') {
      const box = document.getElementById('patientResults');
      box.innerHTML = '<p class="hint">Searching...</p>';
      try {
        const data = await LabApp.api('/api/patients' + (q ? `?q=${encodeURIComponent(q)}` : '?limit=20'));
        if (!data.patients.length) {
          box.innerHTML = '<p class="hint">No saved patients. Fill details below.</p>';
          return;
        }
        box.innerHTML = data.patients.map((p, i) => `
          <button type="button" class="patient-item" data-idx="${i}">
            <strong>${LabApp.escapeHtml(p.pet_name)}</strong>
            <span>${LabApp.escapeHtml(p.species || '')}</span>
            <div class="muted">${LabApp.escapeHtml(p.patient_name)}${p.owner_phone ? ' · ' + LabApp.escapeHtml(p.owner_phone) : ''}</div>
          </button>
        `).join('');
        box.querySelectorAll('.patient-item').forEach((btn) => {
          btn.onclick = () => {
            const p = data.patients[Number(btn.dataset.idx)];
            fillForm({
              patient_name: p.patient_name || '',
              owner_phone: p.owner_phone || '',
              pet_name: p.pet_name || '',
              species: LabApp.normalizeSpecies(p.species),
              breed: p.breed || '',
              age: p.age || '',
              sex: p.sex || '',
              referring_vet: p.referring_vet || '',
            });
            box.querySelectorAll('.patient-item').forEach((b) => b.classList.remove('selected'));
            btn.classList.add('selected');
            showAlert('');
          };
        });
      } catch (err) {
        box.innerHTML = `<p class="hint">${LabApp.escapeHtml(err.message)}</p>`;
      }
    }

    // Bind Next immediately — do not wait for async load
    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      goNext();
    });

    (async () => {
      try {
        const user = await LabApp.requireAuth();
        if (!user) return;

        document.getElementById('logoutBtn').onclick = () => LabApp.logout();
        if (LabApp.renderStepper) {
          document.getElementById('stepper').innerHTML = LabApp.renderStepper(1);
        }

        const params = new URLSearchParams(location.search);
        const editId = params.get('edit');
        const patientQ = params.get('patient');
        const fresh = params.get('fresh') === '1';

        if (fresh && !editId) {
          LabApp.clearDraft();
          LabApp.saveDraft(LabApp.emptyDraft());
        }

        if (editId) {
          const data = await LabApp.api(`/api/reports/${editId}`);
          const r = data.report;
          const results = {};
          (r.panels || []).forEach((panel) => {
            (panel.results || []).forEach((row) => {
              results[row.parameter_id] = row.value || '';
            });
          });
          LabApp.saveDraft({
            editId: r.id,
            patient_name: r.patient_name || '',
            owner_phone: r.owner_phone || '',
            pet_name: r.pet_name || '',
            species: LabApp.normalizeSpecies(r.species),
            breed: r.breed || '',
            age: r.age || '',
            sex: r.sex || '',
            referring_vet: r.referring_vet || '',
            sample_date: String(r.sample_date || LabApp.today()).slice(0, 10),
            report_date: String(r.report_date || LabApp.today()).slice(0, 10),
            remarks: r.remarks || '',
            status: r.status || 'final',
            panel_ids: (r.panels || []).map((p) => p.id),
            results,
          });
      } else if (!localStorage.getItem(LabApp.draftKey) && !sessionStorage.getItem(LabApp.draftKey)) {
        LabApp.saveDraft(LabApp.emptyDraft());
      }

        fillForm(LabApp.getDraft());

        document.getElementById('patientSearchBtn').onclick = () =>
          searchPatients(document.getElementById('patientSearch').value.trim());
        document.getElementById('patientSearch').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            searchPatients(e.target.value.trim());
          }
        });
        document.getElementById('clearPatientBtn').onclick = () => {
          LabApp.saveDraft({
            ...LabApp.emptyDraft(),
            editId: LabApp.getDraft().editId,
          });
          fillForm(LabApp.getDraft());
          searchPatients('');
        };

        if (patientQ) {
          document.getElementById('patientSearch').value = patientQ;
          await searchPatients(patientQ);
        } else {
          await searchPatients('');
        }
      } catch (err) {
        showAlert(err.message || 'Page failed to load');
      }
    })();
  </script>
</body>
</html>
