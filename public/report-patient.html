<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1 · Patient — PetZone Laboratory</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <a href="/dashboard"><img src="/img/petzonelogo.png" alt="PetZone" class="logo-lg" onerror="this.src='/img/petzonelogo.svg'"></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container" style="max-width:920px;">
    <h2 style="color:var(--blue);">New Lab Report</h2>
    <p class="hint" style="margin-bottom:16px;">Step 1 of 4 — Patient details</p>
    <div id="stepper"></div>
    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="section-title">Find existing patient</h3>
      <div class="toolbar">
        <input id="patientSearch" placeholder="Search owner, pet, or phone..." style="flex:1; min-width:220px;">
        <button type="button" class="btn btn-outline btn-sm" id="patientSearchBtn">Search</button>
        <button type="button" class="btn btn-outline btn-sm" id="clearPatientBtn">New Patient</button>
      </div>
      <div id="patientResults" class="patient-list" style="margin-top:12px;"></div>
    </div>

    <form id="patientForm" class="card">
      <h3 class="section-title">Patient Details</h3>
      <div class="grid-3">
        <div class="form-group">
          <label>Owner / Patient Name *</label>
          <input name="patient_name" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input name="owner_phone">
        </div>
        <div class="form-group">
          <label>Referring Vet</label>
          <input name="referring_vet">
        </div>
        <div class="form-group">
          <label>Pet Name *</label>
          <input name="pet_name" required>
        </div>
        <div class="form-group">
          <label>Species *</label>
          <select name="species" required>
            <option value="">Select Dog or Cat</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Breed</label>
          <input name="breed">
        </div>
        <div class="form-group">
          <label>Age</label>
          <input name="age" placeholder="e.g. 3 years">
        </div>
        <div class="form-group">
          <label>Sex</label>
          <select name="sex">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Male Neutered</option>
            <option>Female Spayed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sample Date</label>
          <input type="date" name="sample_date">
        </div>
        <div class="form-group">
          <label>Report Date</label>
          <input type="date" name="report_date">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option value="final">Final</option>
            <option value="draft">Draft</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Remarks</label>
        <textarea name="remarks" rows="2"></textarea>
      </div>

      <div class="wizard-nav">
        <a href="/dashboard" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Next: Select Tests →</button>
      </div>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function fillForm(data) {
      const form = document.getElementById('patientForm');
      Object.keys(data).forEach((k) => {
        if (form.elements[k] != null && data[k] != null) {
          form.elements[k].value = data[k];
        }
      });
    }

    async function searchPatients(q = '') {
      const box = document.getElementById('patientResults');
      box.innerHTML = '<p class="hint">Searching...</p>';
      try {
        const data = await LabApp.api('/api/patients' + (q ? `?q=${encodeURIComponent(q)}` : '?limit=20'));
        if (!data.patients.length) {
          box.innerHTML = '<p class="hint">No saved patients. Fill details below.</p>';
          return;
        }
        box.innerHTML = data.patients.map((p, i) => `
          <button type="button" class="patient-item" data-idx="${i}">
            <strong>${LabApp.escapeHtml(p.pet_name)}</strong>
            <span>${LabApp.escapeHtml(p.species || '')}</span>
            <div class="muted">${LabApp.escapeHtml(p.patient_name)}${p.owner_phone ? ' · ' + LabApp.escapeHtml(p.owner_phone) : ''}</div>
          </button>
        `).join('');
        box.querySelectorAll('.patient-item').forEach((btn) => {
          btn.onclick = () => {
            const p = data.patients[Number(btn.dataset.idx)];
            fillForm({
              patient_name: p.patient_name || '',
              owner_phone: p.owner_phone || '',
              pet_name: p.pet_name || '',
              species: LabApp.normalizeSpecies(p.species),
              breed: p.breed || '',
              age: p.age || '',
              sex: p.sex || '',
              referring_vet: p.referring_vet || '',
            });
            box.querySelectorAll('.patient-item').forEach((b) => b.classList.remove('selected'));
            btn.classList.add('selected');
          };
        });
      } catch (err) {
        box.innerHTML = `<p class="hint">${LabApp.escapeHtml(err.message)}</p>`;
      }
    }

    (async () => {
      const user = await LabApp.requireAuth();
      if (!user) return;
      document.getElementById('logoutBtn').onclick = () => LabApp.logout();
      document.getElementById('stepper').innerHTML = LabApp.renderStepper(1);

      const params = new URLSearchParams(location.search);
      const editId = params.get('edit');
      const patientQ = params.get('patient');

      if (editId) {
        const data = await LabApp.api(`/api/reports/${editId}`);
        const r = data.report;
        const results = {};
        (r.panels || []).forEach((panel) => {
          (panel.results || []).forEach((row) => {
            results[row.parameter_id] = row.value || '';
          });
        });
        LabApp.saveDraft({
          editId: r.id,
          patient_name: r.patient_name || '',
          owner_phone: r.owner_phone || '',
          pet_name: r.pet_name || '',
          species: LabApp.normalizeSpecies(r.species),
          breed: r.breed || '',
          age: r.age || '',
          sex: r.sex || '',
          referring_vet: r.referring_vet || '',
          sample_date: String(r.sample_date || LabApp.today()).slice(0, 10),
          report_date: String(r.report_date || LabApp.today()).slice(0, 10),
          remarks: r.remarks || '',
          status: r.status || 'final',
          panel_ids: (r.panels || []).map((p) => p.id),
          results,
        });
      } else if (!sessionStorage.getItem(LabApp.draftKey) && !patientQ) {
        LabApp.clearDraft();
        LabApp.saveDraft(LabApp.emptyDraft());
      }

      fillForm(LabApp.getDraft());

      if (patientQ) {
        document.getElementById('patientSearch').value = patientQ;
        await searchPatients(patientQ);
      } else {
        await searchPatients('');
      }

      document.getElementById('patientSearchBtn').onclick = () =>
        searchPatients(document.getElementById('patientSearch').value.trim());
      document.getElementById('patientSearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchPatients(e.target.value.trim());
        }
      });
      document.getElementById('clearPatientBtn').onclick = () => {
        LabApp.saveDraft({
          ...LabApp.emptyDraft(),
          editId: LabApp.getDraft().editId,
        });
        fillForm(LabApp.getDraft());
        searchPatients('');
      };

      document.getElementById('patientForm').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const species = LabApp.normalizeSpecies(fd.get('species'));
        if (!fd.get('patient_name') || !fd.get('pet_name') || (species !== 'Dog' && species !== 'Cat')) {
          showAlert('Owner, pet name, and Dog/Cat are required');
          return;
        }
        LabApp.saveDraft({
          patient_name: String(fd.get('patient_name')).trim(),
          owner_phone: String(fd.get('owner_phone') || '').trim(),
          pet_name: String(fd.get('pet_name')).trim(),
          species,
          breed: String(fd.get('breed') || '').trim(),
          age: String(fd.get('age') || '').trim(),
          sex: String(fd.get('sex') || ''),
          referring_vet: String(fd.get('referring_vet') || '').trim(),
          sample_date: fd.get('sample_date') || LabApp.today(),
          report_date: fd.get('report_date') || LabApp.today(),
          remarks: String(fd.get('remarks') || ''),
          status: fd.get('status') || 'final',
        });
        window.location.href = '/report/new/tests';
      };
    })();
  </script>
</body>
</html>
