<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Report â€” PetZone Laboratory</title>
  <link rel="stylesheet" href="/api/static/styles.css?v=21">
</head>
<body class="print-page">
  <header class="header no-print">
    <a class="header-brand" href="/dashboard"><img src="/api/static/img/petzonelogo.png" alt="PetZone" class="logo-lg"><span class="brand-text"><span class="brand-title">PetZone Laboratory</span></span></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">All Reports</a>
      <a href="#" class="btn btn-outline btn-sm" id="editBtn">Edit</a>
      <a href="#" class="btn btn-pink btn-sm" id="newForPetBtn">New for this pet</a>
      <button class="btn btn-primary btn-sm" id="printBtn" type="button">Print / Reprint</button>
    </nav>
  </header>

  <div class="container print-container">
    <div id="alert" class="alert alert-error no-print" style="display:none;"></div>
    <div id="sheet" class="report-sheet report-sheet-pro">Loading report...</div>
  </div>

  <script src="/api/static/app.js?v=21"></script>
  <script>
    function formatDate(value) {
      if (!value) return '';
      const s = String(value);
      return s.length >= 10 ? s.slice(0, 10) : s;
    }

    function metaCell(label, value) {
      return `<div class="meta-cell"><span class="k">${label}</span><span class="v">${LabApp.escapeHtml(value || 'â€”')}</span></div>`;
    }

    function renderReport(report) {
      document.title = `${report.report_no} â€” PetZone Laboratory`;
      document.getElementById('editBtn').href = `/report/${report.id}/edit`;
      document.getElementById('newForPetBtn').href =
        `/report/new?fresh=1&patient=${encodeURIComponent(report.owner_phone || report.pet_name || report.patient_name || '')}`;
      document.getElementById('newForPetBtn').textContent = 'New pet (same phone)';

      const species = report.species === 'Cat' || report.species === 'Dog' ? report.species : (report.species || '');
      const hasUs = (report.panels || []).some((p) => String(p.code).toUpperCase() === 'ULTRASOUND');

      const panelsHtml = (report.panels || [])
        .filter((panel) => String(panel.code).toUpperCase() !== 'SKIN_SCRAPING')
        .map((panel) => {
          const isUs = String(panel.code).toUpperCase() === 'ULTRASOUND';
          if (isUs) {
            return `
        <section class="report-panel">
          <h2>${LabApp.escapeHtml(panel.code)} â€” ${LabApp.escapeHtml(panel.name)}</h2>
          ${LabApp.renderUltrasoundPanelHtml()}
        </section>`;
          }
          const rows = panel.results || [];
          if (!rows.length) return '';
          return `
        <section class="report-panel">
          <h2>${LabApp.escapeHtml(panel.code)} â€” ${LabApp.escapeHtml(panel.name)}</h2>
          <table>
            <thead>
              <tr>
                <th class="col-name">Investigation</th>
                <th class="col-result">Result</th>
                <th class="col-unit">Unit</th>
                <th class="col-ref">Reference (${LabApp.escapeHtml(species || 'â€”')})</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => `
                <tr>
                  <td>${LabApp.escapeHtml(r.name)}</td>
                  <td class="result-val">${LabApp.escapeHtml(r.value || 'â€”')}</td>
                  <td>${LabApp.escapeHtml(r.unit || 'â€”')}</td>
                  <td>${LabApp.escapeHtml(r.reference_range || 'â€”')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>`;
        }).join('');

      const sectionTitle = hasUs && (report.panels || []).every((p) => {
        const c = String(p.code).toUpperCase();
        return c === 'ULTRASOUND' || c === 'SKIN_SCRAPING' || !(p.results || []).length;
      })
        ? 'Ultrasound'
        : 'Investigations &amp; Results';

      const dt = LabApp.formatReportDateParts(report.report_date, report.created_at);

      document.getElementById('sheet').innerHTML = `
        <div class="report-topbar"></div>
        <div class="report-header">
          <div class="rh-left">
            <img src="/api/static/img/petzonelogo.png" alt="PetZone">
          </div>
          <div class="rh-center">
            <h1>PetZone Laboratory</h1>
            <div class="sub">Diagnostic Laboratory Report</div>
          </div>
          <div class="rh-right">
            <div class="dt-label">Date &amp; Time</div>
            <div class="dt-date">${LabApp.escapeHtml(dt.date)}</div>
            <div class="dt-time">${LabApp.escapeHtml(dt.time)}</div>
            <div class="report-meta-line">${LabApp.escapeHtml(report.report_no)}</div>
          </div>
        </div>

        <div class="report-section-title">Patient Information</div>
        <div class="meta-card">
          ${metaCell('Owner', report.patient_name)}
          ${metaCell('Phone', report.owner_phone)}
          ${metaCell('Pet Name', report.pet_name)}
          ${metaCell('Species', species)}
          ${metaCell('Breed', report.breed)}
          ${metaCell('Age', report.age)}
          ${metaCell('Sex', report.sex)}
          ${metaCell('Referring Vet', report.referring_vet)}
          ${metaCell('Sample Date', formatDate(report.sample_date))}
          ${metaCell('Report Date', formatDate(report.report_date))}
        </div>

        <div class="report-section-title">${sectionTitle}</div>
        ${panelsHtml}
        ${report.forms?.SKIN_SCRAPING ? LabApp.renderSkinScrapingHtml(report.forms.SKIN_SCRAPING) : ''}

        ${hasUs ? LabApp.renderUltrasoundImagesHtml(report.images || [], report.forms?.ULTRASOUND) : ''}

        ${!hasUs && report.clinical_notes ? `<div class="remarks-box remarks-box-lg"><strong>Doctor remarks</strong><div class="remarks-body">${LabApp.escapeHtml(report.clinical_notes)}</div></div>` : ''}
        ${report.remarks ? `<div class="remarks-box"><strong>Remarks</strong><div class="remarks-body">${LabApp.escapeHtml(report.remarks)}</div></div>` : ''}

        <div class="report-footer">
          <div class="footer-note">
            For veterinary diagnostic use only. Correlate with clinical findings.<br>
            Reference ranges shown are for <strong>${LabApp.escapeHtml(species || 'selected species')}</strong>.
            ${report.created_by_name ? `<br>Prepared by: ${LabApp.escapeHtml(report.created_by_name)}` : ''}<br>
            <span class="footer-legal">For veterinary treatment purposes. Not intended as a legal or court document.</span>
          </div>
          <div class="sign-box">
            <div class="sign-line"></div>
            <div class="sign-caption">Authorized Signatory</div>
          </div>
        </div>
      `;
    }

    function doPrint() {
      window.print();
    }

    document.getElementById('printBtn').addEventListener('click', doPrint);

    (async () => {
      const user = await LabApp.requireAuth();
      if (!user) return;

      const id = location.pathname.split('/').filter(Boolean)[1];
      try {
        const data = await LabApp.api(`/api/reports/${id}`);
        renderReport(data.report);
        if (new URLSearchParams(location.search).get('print') === '1') {
          setTimeout(doPrint, 400);
        }
      } catch (err) {
        const alert = document.getElementById('alert');
        alert.style.display = 'block';
        alert.textContent = err.message || 'Failed to load report';
        document.getElementById('sheet').textContent = '';
      }
    })();
  </script>
</body>
</html>
