<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Report  -  PetZone Laboratory</title>
  <link rel="stylesheet" href="/api/static/styles.css?v=32">
</head>
<body class="print-page">
  <header class="header no-print">
    <a class="header-brand" href="/dashboard"><img src="/api/static/img/petzonelogo.png" alt="PetZone" class="logo-lg"><span class="brand-text"><span class="brand-title">PetZone Laboratory</span></span></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">All Reports</a>
      <a href="#" class="btn btn-outline btn-sm" id="editBtn">Edit</a>
      <a href="#" class="btn btn-pink btn-sm" id="newForPetBtn">New for this pet</a>
      <button class="btn btn-primary btn-sm" id="printBtn" type="button">Print / Reprint</button>
    </nav>
  </header>

  <div class="container print-container">
    <div id="alert" class="alert alert-error no-print" style="display:none;"></div>
    <div id="sheet" class="report-sheet report-sheet-pro">Loading report...</div>
  </div>

  <script src="/api/static/app.js?v=32"></script>
  <script>
    function formatDate(value) {
      if (!value) return '';
      const s = String(value);
      return s.length >= 10 ? s.slice(0, 10) : s;
    }

    function metaCell(label, value) {
      return `<div class="meta-cell"><span class="k">${label}</span><span class="v">${LabApp.escapeHtml(value || ' - ')}</span></div>`;
    }

    function renderReport(report) {
      document.title = `${report.report_no} - PetZone Laboratory`;
      document.getElementById('editBtn').href = `/report/${report.id}/edit`;
      document.getElementById('newForPetBtn').href =
        `/report/new?fresh=1&patient=${encodeURIComponent(report.owner_phone || report.pet_name || report.patient_name || '')}`;
      document.getElementById('newForPetBtn').textContent = 'New pet (same phone)';

      const species = report.species === 'Cat' || report.species === 'Dog' ? report.species : (report.species || '');
      const hasUs = (report.panels || []).some((p) => String(p.code).toUpperCase() === 'ULTRASOUND');
      const dt = LabApp.formatReportDateParts(report.report_date, report.created_at);
      const chrome = LabApp.renderReportHeaderHtml({
        dt,
        report_no: report.report_no,
      }) + LabApp.renderPatientCardHtml({ ...report, species });
      const footer = LabApp.renderReportFooterHtml({
        species,
        prepared_by: report.created_by_name,
      });

      const bodies = [];
      (report.panels || []).forEach((panel) => {
        const code = String(panel.code).toUpperCase();
        if (LabApp.isFormPanel(code)) {
          bodies.push({ code, html: LabApp.renderSpecialPanelHtml(code, report) });
          return;
        }
        const rows = panel.results || [];
        if (!rows.length) return;
        const isChem = code === 'CHEMISTRY';
        bodies.push({
          code,
          html: `
        <section class="report-panel${isChem ? ' report-panel-chemistry' : ''}">
          <h2>${LabApp.escapeHtml(panel.name || panel.code)}</h2>
          <table>
            <thead>
              <tr>
                <th class="col-name">Investigation</th>
                <th class="col-result">Result</th>
                <th class="col-unit">Unit</th>
                <th class="col-ref">Reference (${LabApp.escapeHtml(species || ' - ')})</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r) => `
                <tr>
                  <td>${LabApp.escapeHtml(r.name)}</td>
                  ${LabApp.resultValueCellHtml(r.value, r.reference_range)}
                  <td>${LabApp.escapeHtml(r.unit || ' - ')}</td>
                  <td>${LabApp.escapeHtml(r.reference_range || ' - ')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>`,
        });
      });

      if (!bodies.length) {
        bodies.push({ code: '', html: '<p class="hint">No test results on this report.</p>' });
      }

      const pagesHtml = bodies.map((item, i) => {
        const isLast = i === bodies.length - 1;
        const isDoc = LabApp.isDocPanel(item.code);
        let extra = '';
        if (isLast && !isDoc) {
          if (!hasUs && report.clinical_notes) {
            extra += `<div class="remarks-box remarks-box-lg"><strong>Doctor remarks</strong><div class="remarks-body">${LabApp.escapeHtml(report.clinical_notes)}</div></div>`;
          }
          if (report.remarks) {
            extra += `<div class="remarks-box"><strong>Remarks</strong><div class="remarks-body">${LabApp.escapeHtml(report.remarks)}</div></div>`;
          }
        }
        const header = LabApp.renderReportHeaderHtml({
          dt,
          report_no: report.report_no,
          subtitle: isDoc ? LabApp.docSubtitle(item.code) : undefined,
        });
        const pageChrome = isDoc ? header : chrome;
        const pageFooter = isDoc ? '' : footer;
        return LabApp.wrapReportPrintPage(pageChrome, item.html + extra, pageFooter, i === 0);
      }).join('');

      document.getElementById('sheet').innerHTML = pagesHtml;
    }

    function doPrint() {
      window.print();
    }

    document.getElementById('printBtn').addEventListener('click', doPrint);

    (async () => {
      const user = await LabApp.requireAuth();
      if (!user) return;

      const id = location.pathname.split('/').filter(Boolean)[1];
      try {
        const data = await LabApp.api(`/api/reports/${id}`);
        renderReport(data.report);
        if (new URLSearchParams(location.search).get('print') === '1') {
          setTimeout(doPrint, 400);
        }
      } catch (err) {
        const alert = document.getElementById('alert');
        alert.style.display = 'block';
        alert.textContent = err.message || 'Failed to load report';
        document.getElementById('sheet').textContent = '';
      }
    })();
  </script>
</body>
</html>
