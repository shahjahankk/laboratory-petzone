<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Report — PetZone Laboratory</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header no-print">
    <a href="/dashboard"><img src="/assets/petzonelogo.png" alt="PetZone" class="logo-lg" onerror="this.src='/assets/petzonelogo.svg'"></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">All Reports</a>
      <a href="#" class="btn btn-outline btn-sm" id="editBtn">Edit</a>
      <button class="btn btn-primary btn-sm" onclick="window.print()">Print</button>
    </nav>
  </header>

  <div class="container">
    <div id="alert" class="alert alert-error no-print" style="display:none;"></div>
    <div id="sheet" class="report-sheet">Loading report...</div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function metaRow(label, value) {
      if (!value) return '';
      return `<div><span class="label">${label}:</span> ${LabApp.escapeHtml(value)}</div>`;
    }

    function renderReport(report) {
      document.title = `${report.report_no} — PetZone Laboratory`;
      document.getElementById('editBtn').href = `/report/${report.id}/edit`;

      const panelsHtml = (report.panels || []).map((panel) => `
        <section class="report-panel">
          <h2>${LabApp.escapeHtml(panel.code)} — ${LabApp.escapeHtml(panel.name)}</h2>
          <table>
            <thead>
              <tr>
                <th>Investigation</th>
                <th>Result</th>
                <th>Unit</th>
                <th>Reference Range</th>
                <th>Flag</th>
              </tr>
            </thead>
            <tbody>
              ${(panel.results || []).map((r) => `
                <tr>
                  <td>${LabApp.escapeHtml(r.name)}</td>
                  <td><strong>${LabApp.escapeHtml(r.value || '-')}</strong></td>
                  <td>${LabApp.escapeHtml(r.unit || '-')}</td>
                  <td>${LabApp.escapeHtml(r.reference_range || '-')}</td>
                  <td class="${r.flag === 'H' ? 'flag-H' : (r.flag === 'L' ? 'flag-L' : '')}">${LabApp.escapeHtml(r.flag || '')}</td>
                </tr>
              `).join('') || '<tr><td colspan="5">No results entered</td></tr>'}
            </tbody>
          </table>
        </section>
      `).join('');

      document.getElementById('sheet').innerHTML = `
        <div class="report-header">
          <div class="brand">
            <img src="/assets/petzonelogo.png" alt="PetZone" onerror="this.src='/assets/petzonelogo.svg'">
            <div>
              <h1>PetZone Laboratory</h1>
              <div class="sub">Diagnostic Laboratory Report</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:13px; color:var(--gray-500);">Report No</div>
            <div style="font-size:20px; font-weight:800; color:var(--blue);">${LabApp.escapeHtml(report.report_no)}</div>
            <div style="margin-top:6px;"><span class="badge badge-${report.status}">${LabApp.escapeHtml(report.status)}</span></div>
          </div>
        </div>

        <div class="meta-grid">
          ${metaRow('Owner / Patient', report.patient_name)}
          ${metaRow('Phone', report.owner_phone)}
          ${metaRow('Pet Name', report.pet_name)}
          ${metaRow('Species', report.species)}
          ${metaRow('Breed', report.breed)}
          ${metaRow('Age', report.age)}
          ${metaRow('Sex', report.sex)}
          ${metaRow('Referring Vet', report.referring_vet)}
          ${metaRow('Sample Date', report.sample_date)}
          ${metaRow('Report Date', report.report_date)}
        </div>

        ${report.clinical_notes ? `<p style="margin-bottom:14px; font-size:13px;"><strong>Clinical Notes:</strong> ${LabApp.escapeHtml(report.clinical_notes)}</p>` : ''}

        ${panelsHtml}

        ${report.remarks ? `<p style="margin-top:8px; font-size:13px;"><strong>Remarks:</strong> ${LabApp.escapeHtml(report.remarks)}</p>` : ''}

        <div class="report-footer">
          <div>
            This report is for veterinary diagnostic purposes only. Correlate with clinical findings.<br>
            Generated by PetZone Laboratory${report.created_by_name ? ` · ${LabApp.escapeHtml(report.created_by_name)}` : ''}
          </div>
          <div style="text-align:right; min-width:160px;">
            _______________________<br>
            Authorized Signatory
          </div>
        </div>
      `;
    }

    (async () => {
      const user = await LabApp.requireAuth();
      if (!user) return;

      const id = location.pathname.split('/').filter(Boolean)[1];
      try {
        const data = await LabApp.api(`/api/reports/${id}`);
        renderReport(data.report);
      } catch (err) {
        const alert = document.getElementById('alert');
        alert.style.display = 'block';
        alert.textContent = err.message || 'Failed to load report';
        document.getElementById('sheet').textContent = '';
      }
    })();
  </script>
</body>
</html>
