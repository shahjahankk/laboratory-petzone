<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2 · Tests — PetZone Laboratory</title>
  <link rel="stylesheet" href="/api/static/styles.css?v=4">
</head>
<body>
  <header class="header">
    <a href="/dashboard"><img src="/api/static/img/petzonelogo.png" alt="PetZone" class="logo-lg" ></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container" style="max-width:920px;">
    <h2 style="color:var(--blue);">Select Tests</h2>
    <p class="hint" style="margin-bottom:16px;">Step 2 of 4 — Choose report panels</p>
    <div id="stepper"></div>
    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <div class="card" style="margin-bottom:16px;">
      <div id="patientSummary" class="hint" style="margin-bottom:12px;"></div>
      <div class="grid-3" id="panelChecks"><p class="hint">Loading tests...</p></div>
    </div>

    <div class="wizard-nav">
      <a href="/report/new" class="btn btn-outline" id="backBtn">← Back: Patient</a>
      <button type="button" class="btn btn-primary" id="nextBtn">Next: Enter Results →</button>
    </div>
  </div>

  <script src="/api/static/app.js?v=4"></script>
  <script>
    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function goNext() {
      showAlert('');
      const ids = [...document.querySelectorAll('#panelChecks input:checked')].map((el) => Number(el.value)).filter(Boolean);
      if (!ids.length) {
        showAlert('Select at least one test');
        return;
      }
      LabApp.saveDraft({ panel_ids: ids });
      const check = LabApp.getDraft();
      if (!check.panel_ids.length) {
        showAlert('Could not save test selection. Try again.');
        return;
      }
      window.location.assign('/report/new/results');
    }

    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.preventDefault();
      goNext();
    });

    (async () => {
      try {
        const user = await LabApp.requireAuth();
        if (!user) return;
        const draft = LabApp.guardStep(['patient']);
        if (!draft) return;

        document.getElementById('logoutBtn').onclick = () => LabApp.logout();
        document.getElementById('stepper').innerHTML = LabApp.renderStepper(2);
        document.getElementById('patientSummary').innerHTML =
          `<strong>${LabApp.escapeHtml(draft.pet_name)}</strong> · ${LabApp.escapeHtml(draft.species)} · ${LabApp.escapeHtml(draft.patient_name)}`;

        const tpl = await LabApp.api('/api/templates');
        const panels = tpl.panels || [];
        const selected = new Set((draft.panel_ids || []).map(Number));

        const box = document.getElementById('panelChecks');
        if (!panels.length) {
          box.innerHTML = '<p class="hint">No test panels found in database.</p>';
          return;
        }

        box.innerHTML = panels.map((p) => `
          <label class="panel-check ${selected.has(Number(p.id)) ? 'active' : ''}">
            <input type="checkbox" value="${p.id}" ${selected.has(Number(p.id)) ? 'checked' : ''}>
            <span>
              <strong>${LabApp.escapeHtml(p.code)}</strong><br>
              <small style="color:var(--gray-500)">${LabApp.escapeHtml(p.name)}</small>
            </span>
          </label>
        `).join('');

        box.querySelectorAll('input').forEach((input) => {
          input.addEventListener('change', () => {
            input.closest('.panel-check').classList.toggle('active', input.checked);
          });
        });
      } catch (err) {
        showAlert(err.message || 'Failed to load tests');
      }
    })();
  </script>
</body>
</html>
