<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4  -  Preview  -  Pet Zone Laboratory</title>
  <link rel="stylesheet" href="/api/static/styles.css?v=22">
</head>
<body>
  <header class="header no-print">
    <a class="header-brand" href="/dashboard"><img src="/api/static/img/petzonelogo.png" alt="PetZone" class="logo-lg"><span class="brand-text"><span class="brand-title">Pet Zone Laboratory</span></span></a>
    <nav>
      <a href="/dashboard" class="btn btn-outline btn-sm">Dashboard</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <div class="container">
    <div class="no-print">
      <h2 style="color:var(--blue);">Report Preview</h2>
      <p class="hint" style="margin-bottom:16px;">Step 4 of 4  -  Review, then save &amp; print</p>
      <div id="stepper"></div>
      <div id="alert" class="alert alert-error" style="display:none;"></div>
      <div class="wizard-nav" style="margin-bottom:16px;">
        <a href="/report/new/results" class="btn btn-outline">â† Back: Results</a>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-outline" id="saveOnlyBtn">Save Only</button>
          <button type="button" class="btn btn-primary" id="savePrintBtn">Save &amp; Print</button>
        </div>
      </div>
    </div>

    <div class="preview-frame no-print-bg">
      <div id="sheet" class="report-sheet report-sheet-pro">Building preview...</div>
    </div>
  </div>

  <script src="/api/static/app.js?v=22"></script>
  <script>
    function showAlert(msg) {
      const el = document.getElementById('alert');
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function formatDate(v) {
      return v ? String(v).slice(0, 10) : ' - ';
    }

    function metaCell(label, value) {
      return `<div class="meta-cell"><span class="k">${label}</span><span class="v">${LabApp.escapeHtml(value || ' - ')}</span></div>`;
    }

    function refFor(param, species) {
      if (species === 'Cat') return param.reference_range_cat || param.reference_range || ' - ';
      return param.reference_range_dog || param.reference_range || ' - ';
    }

    function renderPreview(draft, panels) {
      const species = draft.species;
      const idSet = new Set((draft.panel_ids || []).map(Number));
      const selected = panels.filter((p) => idSet.has(Number(p.id)));
      const values = draft.results || {};
      const allParamIds = selected.flatMap((p) => (p.parameters || []).map((x) => Number(x.id)));
      const included = new Set(LabApp.resolveIncludedParameterIds(allParamIds, draft));
      const hasUs = selected.some((p) => String(p.code).toUpperCase() === 'ULTRASOUND');

      const panelsHtml = selected.map((panel) => {
        const code = String(panel.code).toUpperCase();
        if (code === 'SKIN_SCRAPING') return '';
        if (code === 'ULTRASOUND') {
          return `
        <section class="report-panel">
          ${LabApp.renderUltrasoundHeadingHtml(draft.forms?.ULTRASOUND, true)}
          ${LabApp.renderUltrasoundPanelHtml(draft.forms?.ULTRASOUND)}
        </section>`;
        }
        const params = (panel.parameters || []).filter((param) => included.has(Number(param.id)));
        if (!params.length) return '';
        return `
        <section class="report-panel">
          <h2>${LabApp.escapeHtml(panel.name || panel.code)}</h2>
          <table>
            <thead>
              <tr>
                <th class="col-name">Investigation</th>
                <th class="col-result">Result</th>
                <th class="col-unit">Unit</th>
                <th class="col-ref">Reference (${LabApp.escapeHtml(species)})</th>
              </tr>
            </thead>
            <tbody>
              ${params.map((param) => `
                <tr>
                  <td>${LabApp.escapeHtml(param.name)}</td>
                  <td class="result-val">${LabApp.escapeHtml(values[param.id] || values[String(param.id)] || ' - ')}</td>
                  <td>${LabApp.escapeHtml(param.unit || ' - ')}</td>
                  <td>${LabApp.escapeHtml(refFor(param, species))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>`;
      }).join('') || '';

      const images = draft.images || [];
      const imagesHtml = hasUs
        ? LabApp.renderUltrasoundImagesHtml(images, draft.forms?.ULTRASOUND)
        : '';

      const sectionTitle = hasUs && selected.every((p) => {
        const c = String(p.code).toUpperCase();
        return c === 'ULTRASOUND' || c === 'SKIN_SCRAPING';
      })
        ? 'Ultrasound'
        : 'Investigations &amp; Results';

      const dt = LabApp.formatReportDateParts(draft.report_date);

      document.getElementById('sheet').innerHTML = `
        <div class="report-topbar"></div>
        <div class="report-header">
          <div class="rh-left">
            <img src="/api/static/img/petzonelogo.png" alt="PetZone">
          </div>
          <div class="rh-center">
            <h1>Pet Zone Laboratory</h1>
            <div class="sub">Diagnostic Laboratory Report</div>
          </div>
          <div class="rh-right">
            <div class="dt-label">Date &amp; Time</div>
            <div class="dt-date">${LabApp.escapeHtml(dt.date)}</div>
            <div class="dt-time">${LabApp.escapeHtml(dt.time)}</div>
          </div>
        </div>
        <div class="report-section-title">Patient Information</div>
        <div class="meta-card">
          ${metaCell('Owner', draft.patient_name)}
          ${metaCell('Phone', draft.owner_phone)}
          ${metaCell('Pet Name', draft.pet_name)}
          ${metaCell('Species', species)}
          ${metaCell('Breed', draft.breed)}
          ${metaCell('Age', draft.age)}
          ${metaCell('Sex', draft.sex)}
          ${metaCell('Referring Vet', draft.referring_vet)}
          ${metaCell('Sample Date', formatDate(draft.sample_date))}
          ${metaCell('Report Date', formatDate(draft.report_date))}
        </div>
        <div class="report-section-title">${sectionTitle}</div>
        ${panelsHtml}
        ${draft.forms?.SKIN_SCRAPING ? LabApp.renderSkinScrapingHtml(draft.forms.SKIN_SCRAPING) : ''}
        ${imagesHtml}
        ${!hasUs && draft.clinical_notes ? `<div class="remarks-box remarks-box-lg"><strong>Doctor remarks</strong><div class="remarks-body">${LabApp.escapeHtml(draft.clinical_notes)}</div></div>` : ''}
        ${draft.remarks ? `<div class="remarks-box"><strong>Remarks</strong><div class="remarks-body">${LabApp.escapeHtml(draft.remarks)}</div></div>` : ''}
        <div class="report-footer">
          <div class="footer-note">
            For veterinary diagnostic use only. Correlate with clinical findings.<br>
            Reference ranges shown are for <strong>${LabApp.escapeHtml(species)}</strong>.<br>
            <span class="footer-legal">For veterinary treatment purposes. Not intended as a legal or court document.</span>
          </div>
          <div class="sign-box">
            <div class="sign-line"></div>
            <div class="sign-caption">Authorized Signatory</div>
          </div>
        </div>
      `;
    }

    function buildPayload(draft) {
      const included = Array.isArray(draft.included_parameter_ids) && draft.included_parameter_ids.length
        ? draft.included_parameter_ids.map(Number).filter(Boolean)
        : Object.keys(draft.results || {}).map(Number).filter(Boolean);

      return {
        patient_name: draft.patient_name,
        owner_phone: draft.owner_phone,
        pet_name: draft.pet_name,
        species: draft.species,
        breed: draft.breed,
        age: draft.age,
        sex: draft.sex,
        referring_vet: draft.referring_vet,
        sample_date: draft.sample_date || null,
        report_date: draft.report_date || null,
        clinical_notes: draft.clinical_notes || '',
        remarks: draft.remarks,
        status: 'final',
        panel_ids: (draft.panel_ids || []).map(Number).filter(Boolean),
        image_ids: (draft.images || []).map((img) => Number(img.id)).filter(Boolean),
        forms: draft.forms || {},
        results: included.map((parameter_id) => ({
          parameter_id,
          value: draft.results?.[parameter_id] ?? draft.results?.[String(parameter_id)] ?? '',
          flag: null,
          remarks: null,
        })),
      };
    }

    async function saveReport(andPrint) {
      const draft = LabApp.getDraft();
      showAlert('');
      if (!LabApp.hasPatient(draft) || !LabApp.hasTests(draft)) {
        showAlert('Draft incomplete. Go back and finish Patient + Tests.');
        return;
      }

      const saveOnlyBtn = document.getElementById('saveOnlyBtn');
      const savePrintBtn = document.getElementById('savePrintBtn');
      saveOnlyBtn.disabled = true;
      savePrintBtn.disabled = true;

      try {
        const payload = buildPayload(draft);
        const data = draft.editId
          ? await LabApp.api(`/api/reports/${draft.editId}`, { method: 'PUT', body: payload })
          : await LabApp.api('/api/reports', { method: 'POST', body: payload });
        LabApp.clearDraft();
        window.location.assign(`/report/${data.report.id}${andPrint ? '?print=1' : ''}`);
      } catch (err) {
        showAlert(err.message || 'Save failed');
        saveOnlyBtn.disabled = false;
        savePrintBtn.disabled = false;
      }
    }

    document.getElementById('saveOnlyBtn').addEventListener('click', (e) => {
      e.preventDefault();
      saveReport(false);
    });
    document.getElementById('savePrintBtn').addEventListener('click', (e) => {
      e.preventDefault();
      saveReport(true);
    });

    (async () => {
      try {
        const user = await LabApp.requireAuth();
        if (!user) return;
        const draft = LabApp.guardStep(['patient', 'tests']);
        if (!draft) return;

        document.getElementById('logoutBtn').onclick = () => LabApp.logout();
        document.getElementById('stepper').innerHTML = LabApp.renderStepper(4);

        const tpl = await LabApp.api('/api/templates');
        renderPreview(draft, tpl.panels || []);
      } catch (err) {
        showAlert(err.message || 'Failed to load preview');
      }
    })();
  </script>
</body>
</html>
